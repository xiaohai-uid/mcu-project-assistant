name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: ruff check src/ tests/
      - run: pytest tests/ -q

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pytest jinja2 pydantic pika fastapi uvicorn httpx pyyaml
      - name: Run pytest
        run: pytest shared/tests services/codegen-service/test_codegen.py services/schematic-service/test_schematic.py -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [gateway-tests, worker-tests, python-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build all services
        run: docker compose build
