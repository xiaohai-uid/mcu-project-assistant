name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
        working-directory: gateway
      - run: npm run lint
        working-directory: gateway
      - run: npx tsc --noEmit
        working-directory: gateway
      - run: npm test
        working-directory: gateway
      - run: npm run build
        working-directory: gateway
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx beautifulsoup4 openai
      - run: python -m compileall services/
