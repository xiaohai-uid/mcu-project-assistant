[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcu-design-worker"
version = "0.1.0"
description = "MCU Project Assistant V2 Design Worker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "psycopg[binary]>=3.1",
    "pika>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcu_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
