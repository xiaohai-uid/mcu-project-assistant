id: arduino_uno
schema_version: '1'
display_name: Arduino UNO
family: avr
framework: arduino
logic_voltage: 5.0
pins:
  digital:
  - D0
  - D1
  - D2
  - D3
  - D4
  - D5
  - D6
  - D7
  - D8
  - D9
  - D10
  - D11
  - D12
  - D13
  analog:
  - A0
  - A1
  - A2
  - A3
  - A4
  - A5
  pwm:
  - D3
  - D5
  - D6
  - D9
  - D10
  - D11
buses:
  i2c:
    pins:
      sda: A4
      scl: A5
    shared: true
  spi:
    pins:
      ss: D10
      mosi: D11
      miso: D12
      sck: D13
    shared: true
  uart:
    pins:
      rx: D0
      tx: D1
    shared: false
reserved_pins:
- pin: D0
  reason: UART RX (Serial)
- pin: D1
  reason: UART TX (Serial)
- pin: A4
  reason: I2C SDA (shared bus)
- pin: A5
  reason: I2C SCL (shared bus)
memory:
  flash_kb: 32
  sram_kb: 2
  eeprom_kb: 1
power_limits:
  max_pin_current_ma: 40
  max_total_current_ma: 200
  vin_range:
  - 7.0
  - 12.0
  regulated_5v_available: true
  regulated_3v3_available: false
toolchain:
  type: arduino_cli
  fqbn: arduino:avr:uno
  core: arduino:avr
codegen_profile: arduino_avr
