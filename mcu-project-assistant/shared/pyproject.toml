[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mcu-project-assistant-shared"
version = "0.1.0"
description = "Shared utilities for MCU Project Assistant services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pika>=1.3.2",
    "pydantic>=2.9.0",
    "openai>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["shared*"]
