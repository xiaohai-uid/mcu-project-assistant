version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcu_assistant
      POSTGRES_USER: mcu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcu_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcu-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mcu_service}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mcu_mq_secret}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcu-network

  requirement-service:
    build:
      context: .
      dockerfile: services/requirement-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-mcu_service}:${RABBITMQ_PASSWORD:-mcu_mq_secret}@rabbitmq:5672
      DATABASE_URL: postgresql://mcu:${POSTGRES_PASSWORD:-mcu_secret}@postgres:5432/mcu_assistant
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MOCK_MODE: ${MOCK_MODE:-false}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - mcu-network

  recommendation-service:
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-mcu_service}:${RABBITMQ_PASSWORD:-mcu_mq_secret}@rabbitmq:5672
      DATABASE_URL: postgresql://mcu:${POSTGRES_PASSWORD:-mcu_secret}@postgres:5432/mcu_assistant
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MOCK_MODE: ${MOCK_MODE:-false}
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - mcu-network

  websearch-service:
    build:
      context: .
      dockerfile: services/websearch-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-mcu_service}:${RABBITMQ_PASSWORD:-mcu_mq_secret}@rabbitmq:5672
      MOCK_MODE: ${MOCK_MODE:-false}
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - mcu-network

  codegen-service:
    build:
      context: .
      dockerfile: services/codegen-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-mcu_service}:${RABBITMQ_PASSWORD:-mcu_mq_secret}@rabbitmq:5672
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MOCK_MODE: ${MOCK_MODE:-false}
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - mcu-network

  schematic-service:
    build:
      context: .
      dockerfile: services/schematic-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-mcu_service}:${RABBITMQ_PASSWORD:-mcu_mq_secret}@rabbitmq:5672
      MOCK_MODE: ${MOCK_MODE:-false}
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - mcu-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://mcu:${POSTGRES_PASSWORD:-mcu_secret}@postgres:5432/mcu_assistant
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-mcu_service}:${RABBITMQ_PASSWORD:-mcu_mq_secret}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      REQUIREMENT_SERVICE_URL: http://requirement-service:8001
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8002
      WEBSERVICE_URL: http://websearch-service:8003
      CODEGEN_SERVICE_URL: http://codegen-service:8004
      SCHEMATIC_SERVICE_URL: http://schematic-service:8005
      ENCRYPTION_KEY_OLD: ${ENCRYPTION_KEY_OLD:-}
      MIGRATIONS_DIR: /app/migrations
      DAILY_QUOTA_LIMIT: "10"
      FREE_API_ENDPOINT: https://api.deepseek.com/v1/chat/completions
      FREE_API_MODEL: deepseek-chat
      FREE_API_KEY: ${FREE_API_KEY:-}
      PREMIUM_API_ENDPOINT: https://api.openai.com/v1/chat/completions
      PREMIUM_API_MODEL: gpt-4o
      PREMIUM_API_KEY: ${PREMIUM_API_KEY:-}
    volumes:
      - ./shared/database/migrations:/app/migrations:ro
    depends_on:
      requirement-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      websearch-service:
        condition: service_healthy
      codegen-service:
        condition: service_healthy
      schematic-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - mcu-network

networks:
  mcu-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
